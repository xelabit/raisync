<svg xmlns="http://www.w3.org/2000/svg" width="252" height="108" viewBox="0 0 252 108" role="img" aria-labelledby="title desc">
<title id="title">Group features in the same recording-time window</title>
<desc id="desc">The shaded interval includes 2 seconds and ends just before 4 seconds. It covers envelope frames, the onset at 2 seconds, and the selected EEG channel over the same interval.</desc>
